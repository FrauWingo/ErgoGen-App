<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErgoGen - Berichtsassistent</title>
    <!-- docx Library für Word-Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.1.0/docx.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        textarea, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-success {
            background-color: #2ecc71;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        .hidden {
            display: none !important;
        }
        #pin-screen {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #pin-screen input {
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }
        .settings-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- PIN SCHUTZ -->
    <div id="pin-screen">
        <h2>Geschützter Bereich</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Bitte PIN eingeben, um fortzufahren.</p>
        <input type="password" id="pin-input" maxlength="5" placeholder="•••••">
        <br>
        <button onclick="checkPin()">Entsperren</button>
        <p id="pin-error" style="color: #e74c3c; font-size: 13px; margin-top: 10px;" class="hidden">Falsche PIN!</p>
    </div>

    <!-- HAUPT-ANWENDUNG -->
    <div id="app-container" class="container hidden">
        <h1>Ergo Gen</h1>
        <div class="subtitle">Berichtsassistent für die Ergotherapie</div>

        <!-- API-Schlüssel Eingabe -->
        <div class="settings-box">
            <label for="api-key-input">API-Schlüssel:</label>
            <input type="password" id="api-key-input" placeholder="Google Gemini API-Schlüssel hier einfügen...">
        </div>

        <div class="form-group">
            <label for="patient-name">Name / Eckdaten des Kindes:</label>
            <input type="text" id="patient-name" placeholder="z. B. Max Mustermann, 8 Jahre">
        </div>

        <div class="form-group">
            <label for="notes-input">Stichpunkte aus der Therapie:</label>
            <textarea id="notes-input" placeholder="Stichpunkte hier eingeben..."></textarea>
        </div>

        <button onclick="generateReport()">Bericht generieren</button>

        <div class="form-group" style="margin-top: 30px;">
            <label for="output-box">Generierter Bericht:</label>
            <textarea id="output-box" style="height: 200px;" placeholder="Der fertige Bericht erscheint hier..."></textarea>
        </div>

        <button class="btn-success" onclick="exportToWord()">Als Word-Dokument (.docx) exportieren</button>
    </div>

    <script>
        const CORRECT_PIN = "75328";

        function checkPin() {
            const enteredPin = document.getElementById('pin-input').value;
            if (enteredPin === CORRECT_PIN) {
                document.getElementById('pin-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        async function generateReport() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const patientName = document.getElementById('patient-name').value;
            const notes = document.getElementById('notes-input').value;
            const outputBox = document.getElementById('output-box');

            if (!apiKey) {
                alert("Bitte trage den API-Schlüssel ein.");
                return;
            }
            if (!notes) {
                alert("Bitte gib Stichpunkte ein.");
                return;
            }

            outputBox.value = "Generiere Bericht...";

            const systemPrompt = "Du bist ein erfahrener Ergotherapeut. Wandle die folgenden Stichpunkte in einen professionellen, zusammenhängenden klinischen Bericht im reinen Fließtext um. Verwende keinerlei Markdown-Formatierungen wie Sternchen oder Rauten.";
            const userPrompt = `Patient: ${patientName}\n\nStichpunkte:\n${notes}`;

            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    let text = data.candidates[0].content.parts[0].text;
                    text = text.replace(/[*#_`]/g, '');
                    outputBox.value = text;
                } else {
                    outputBox.value = "Fehler bei der Generierung. Bitte API-Schlüssel prüfen.";
                }
            } catch (error) {
                outputBox.value = "Verbindungsfehler: " + error.message;
            }
        }

        function exportToWord() {
            const text = document.getElementById('output-box').value;
            const patientName = document.getElementById('patient-name').value || "Bericht";

            if (!text) {
                alert("Kein Text zum Exportieren vorhanden.");
                return;
            }

            const docxData = window.docx;
            const doc = new docxData.Document({
                sections: [{
                    properties: {},
                    children: [
                        new docxData.Paragraph({
                            children: [new docxData.TextRun({ text: "Ergotherapeutischer Bericht", bold: true, size: 28 })],
                        }),
                        new docxData.Paragraph({
                            children: [new docxData.TextRun({ text: "Patient: " + patientName, italic: true, size: 22 })],
                            spacing: { after: 300 }
                        }),
                        ...text.split('\n').map(paragraph => 
                            new docxData.Paragraph({
                                children: [new docxData.TextRun({ text: paragraph, size: 22 })],
                                spacing: { after: 200 }
                            })
                        )
                    ],
                }],
            });

            docxData.Packer.toBlob(doc).then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Ergotherapie_Bericht_${patientName.replace(/[^a-zA-Z0-9]/g, '_')}.docx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
